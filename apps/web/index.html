<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="What was said on the air, in text, with the minute it was said." />
    <title>Said on Air</title>
    <!--
      The reader's theme before first paint, so dark never starts white. In `<head>` since
      2026-09-21: the Worker renders the public pages, so there is now markup the browser can paint
      before a script at the end of `<body>` would have run. Deliberately duplicated
      from lib/settings.ts rather than imported: the module bundle loads after paint, which is the
      whole flash this avoids. Defensive throughout — blocked storage, a corrupt value and an
      unknown name all fall through to the light default the stylesheet already carries.
    -->
    <script>
      (() => {
        const allowed = {
          readingTheme: ["light", "sepia", "dark"],
          readingFont: ["serif", "sans"],
          readingSize: ["small", "medium", "large"],
        };
        try {
          const stored = JSON.parse(
            localStorage.getItem("media-digest:settings") || "{}",
          );
          for (const [key, values] of Object.entries(allowed)) {
            if (values.includes(stored[key])) {
              document.documentElement.dataset[key] = stored[key];
            }
          }
        } catch {
          // Blocked storage or a corrupt value: the stylesheet's light default already applies.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
